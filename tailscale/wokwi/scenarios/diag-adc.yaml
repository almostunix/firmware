# DIAGNOSTIC: steps the battery pot through three known positions to measure Wokwi's ADC transfer
# function (reads are throttled to one per 5 s, so each is held 8 s), and watches a dummy-key join.
name: Diagnostic -- ADC transfer function and tailnet bring-up
version: 1
author: almostunix
steps:
  - wait-serial: 'Battery ADC ready'
  - wait-serial: 'Obtained IP address'
  - wait-serial: 'Tailscale: joining tailnet as'
  # Point 1: initial position 0.2308 (value 236) -> 0.762 V at the pin.
  - delay: 8s
  - set-control:
      part-id: batt
      control: position
      value: 0.5
  - delay: 8s
  - set-control:
      part-id: batt
      control: position
      value: 0.8
  - delay: 8s
  # Time for the dummy key's rejection to reach the log.
  - delay: 20s
