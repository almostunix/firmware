  -D VIEW_240x320
  -D DISPLAY_SET_RESOLUTION
  -D DISPLAY_SIZE=240x320 ; portrait mode
  -D LGFX_SPI_3WIRE=true
  -D LGFX_PIN_SCK=17
  -D LGFX_PIN_MOSI=33
  -D LGFX_PIN_MISO=-1
  -D LGFX_PIN_DC=16
  -D LGFX_PIN_CS=15
  -D LGFX_PIN_BL=21
  -D LGFX_PIN_RST=18
  -D CUSTOM_TOUCH_DRIVER
  -D TOUCH_SDA_PIN=I2C_SDA1
  -D TOUCH_SCL_PIN=I2C_SCL1
  -D TOUCH_INT_PIN=-1  ;45
  -D TOUCH_RST_PIN=44
;base UI
  -D TFT_CS=LGFX_PIN_CS
  -D ST7789_CS=TFT_CS
  -D ST7789_RS=LGFX_PIN_DC
  -D ST7789_SDA=LGFX_PIN_MOSI 
  -D ST7789_SCK=LGFX_PIN_SCK
  -D ST7789_RESET=LGFX_PIN_RST
  -D ST7789_MISO=-1
  -D ST7789_BUSY=-1
  -D ST7789_BL=LGFX_PIN_BL
  -D ST7789_SPI_HOST=SPI3_HOST
  -D TFT_BL=ST7789_BL
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=4000000
  -D TFT_HEIGHT=320
  -D TFT_WIDTH=240
  -D TFT_OFFSET_X=0
  -D TFT_OFFSET_Y=0
  -D TFT_OFFSET_ROTATION=0
  -D SCREEN_ROTATE
  -D SCREEN_TRANSITION_FRAMERATE=5
  -D BRIGHTNESS_DEFAULT=130 ; Medium Low Brightness
  -D HAS_TOUCHSCREEN=1
  -D TOUCH_I2C_PORT=1
  -D TOUCH_SLAVE_ADDRESS=0x2E
  -D SCREEN_TOUCH_INT=TOUCH_INT_PIN
  -D SCREEN_TOUCH_RST=TOUCH_RST_PIN

lib_deps = ${heltec_v4_base.lib_deps}
  ${device-ui_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.21
  # renovate: datasource=git-refs depName=Quency-D_chsc6x packageName=https://github.com/Quency-D/chsc6x gitBranch=master
  https://github.com/Quency-D/chsc6x/archive/5cbead829d6b432a8d621ed1aafd4eb474fd4f27.zip

; Heltec V4 plus the phone API on a tailnet. Build tailscale-rs first: see TAILSCALE-QUICKSTART.md.
[env:heltec-v4-tailscale]
extends = env:heltec-v4
; Needs the Rust library, so upstream CI's default matrix must skip it.
board_level = extra
custom_tailscale_rust_target = xtensa-esp32s3-espidf
; Stock default_16MB.csv (inherited): flasher.meshtastic.org writes the OTA loader at 0x650000.
extra_scripts =
  ${esp32_common.extra_scripts}
  post:extra_scripts/tailscale_link.py
build_flags =
  ${env:heltec-v4.build_flags}
  -D MESHTASTIC_TAILSCALE

; heltec-v4-tailscale without Bluetooth: a fallback, ~200 KB smaller.
[env:heltec-v4-tailscale-nobt]
extends = env:heltec-v4-tailscale
build_flags =
  ${env:heltec-v4-tailscale.build_flags}
  -D MESHTASTIC_EXCLUDE_BLUETOOTH=1

; For the Wokwi simulator only (bin/wokwi-run.sh); never flash it. Wokwi's gateway sees all traffic,
; so use a throwaway tailnet and an ephemeral key.
[env:heltec-v4-tailscale-wokwi]
extends = env:heltec-v4-tailscale
; wokwi-cli uploads everything up to the last partition, so a compact table keeps the image small.
board_build.partitions = partition-table-wokwi.csv
extra_scripts =
  ${env:heltec-v4-tailscale.extra_scripts}
  post:extra_scripts/wokwi_stage.py
; Serial on UART0, which diagram.json wires to Wokwi's monitor; the simulator has no USB CDC.
build_unflags =
  # Re-listed because this list replaces esp32_common's, whose -fno-lto removal the link needs.
  ${esp32_common.build_unflags}
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  ${env:heltec-v4-tailscale.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D MESHTASTIC_SIMULATOR_NO_LORA=1
  ; No GPS to find; probing costs ~6 s of a 5-minute simulator run.
  -D USERPREFS_CONFIG_GPS_MODE=meshtastic_Config_PositionConfig_GpsMode_NOT_PRESENT
  ; Battery cutoff in ~35 s of simulated time rather than ~260 s.
  -D POWER_POLL_INTERVAL_MS=2000
  -D POWER_LOG_ADC_READS=1
  ; Heap and stack figures at each tailnet bring-up stage.
  -D MESHTASTIC_TAILSCALE_DIAGNOSTICS=1
  -D USERPREFS_NETWORK_WIFI_ENABLED=true
  -D USERPREFS_NETWORK_WIFI_SSID='"Wokwi-GUEST"'
  -D USERPREFS_NETWORK_WIFI_PSK='""'
