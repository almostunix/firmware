; ---------------------------------------------------------------------------
; Same as [env:heltec-v4], plus the Tailscale-backed API server.
;
; Phase 2 target: link the Xtensa build of tailscale-rs into real ESP32-S3
; firmware. Build the Rust side first -- PlatformIO does not drive it:
;
;     cd ../tailscale-rs-0.6.1
;     . ~/export-esp.sh
;     RUSTUP_TOOLCHAIN=esp cargo build -p ts_ffi --release \
;       --target xtensa-esp32s3-espidf -Zbuild-std=std,panic_abort
;
;     pio run -e heltec-v4-tailscale
;
; Kept separate from [env:heltec-v4] so the stock build stays a control: with
; two variables in play (the IDF 5 platform bump and this integration), a single
; env would make every failure ambiguous.
; ---------------------------------------------------------------------------
[env:heltec-v4-tailscale]
extends = env:heltec-v4
custom_tailscale_rust_target = xtensa-esp32s3-espidf
; Stock default_16MB.csv (inherited): flasher.meshtastic.org writes the OTA loader at 0x650000.
extra_scripts =
  ${esp32_common.extra_scripts}
  post:extra_scripts/tailscale_link.py
build_flags =
  ${env:heltec-v4.build_flags}
  -D MESHTASTIC_TAILSCALE
  ; cbindgen writes tailscale.h into the crate root during `cargo build`.
  -I../tailscale-rs-0.6.1/ts_ffi

; heltec-v4-tailscale without Bluetooth: a fallback, ~200 KB smaller.
[env:heltec-v4-tailscale-nobt]
extends = env:heltec-v4-tailscale
build_flags =
  ${env:heltec-v4-tailscale.build_flags}
  -D MESHTASTIC_EXCLUDE_BLUETOOTH=1

; ---------------------------------------------------------------------------
; heltec-v4-tailscale, configured to boot in the Wokwi simulator.
;
; Separate from the board env on purpose: Wokwi's WiFi credentials have no
; business in firmware that might get flashed to real hardware.
;
; Wokwi provides internet through an open network called "Wokwi-GUEST", and a
; fresh Meshtastic node has WiFi disabled, so the SSID is baked into the default
; config via the USERPREFS_* hooks that NodeDB.cpp:757 reads.
;
;     pio run -e heltec-v4-tailscale-wokwi
;     wokwi-cli --timeout 120000 .      # needs WOKWI_CLI_TOKEN
;
; Privacy note: Wokwi's public gateway monitors all traffic, so this must be
; pointed at a THROWAWAY tailnet with an ephemeral key -- never a real one.
; ---------------------------------------------------------------------------
[env:heltec-v4-tailscale-wokwi]
extends = env:heltec-v4-tailscale
; Compact layout: wokwi-cli uploads flash from 0 to the end of the last
; partition, so the development table's 6.3MB gap before spiffs made a 15.9MB
; blob that stalled the transport. See partition-table-wokwi.csv.
board_build.partitions = partition-table-wokwi.csv
extra_scripts =
  ${env:heltec-v4-tailscale.extra_scripts}
  post:extra_scripts/wokwi_stage.py
; The board definition forces -DARDUINO_USB_CDC_ON_BOOT=1, which points Serial
; at the USB CDC peripheral. diagram.json wires Wokwi's serial monitor to UART0,
; so every Meshtastic log line went into a USB stack the simulator does not
; emulate -- the console showed only ROM and IDF output, and Arduino's
; printAfterSetupInfo() crashed writing through it (IllegalInstruction at a DROM
; address, i.e. an uninitialised callback). Put Serial back on UART0.
build_unflags =
  # Must re-list the inherited unflags: declaring build_unflags here shadows
  # esp32_common's, and losing its -fno-lto removal disables LTO for our
  # objects while the framework's stay LTO, so the link fails with
  # "plugin needed to handle lto object" / undefined reference to app_main.
  ${esp32_common.build_unflags}
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  ${env:heltec-v4-tailscale.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D MESHTASTIC_SIMULATOR_NO_LORA=1
  ; No GPS in the simulation, and probing for one costs ~6s of simulated time
  ; per boot trying baud rates and vendor commands. Wokwi's free plan caps a run
  ; at 5 minutes of wall clock, so that time comes straight out of the window
  ; the tailnet join has to fit in. NOT_PRESENT skips GPS construction entirely.
  -D USERPREFS_CONFIG_GPS_MODE=meshtastic_Config_PositionConfig_GpsMode_NOT_PRESENT
  ; Fast-forward the battery cutoff. At the default 20s poll the cutoff needs
  ; ~260s of simulated time after the voltage drops (two readings for the
  ; smoothing filter to cross 3100 mV, then more than 10 consecutive lows).
  ; 2s tests the same logic in ~35s.
  -D POWER_POLL_INTERVAL_MS=2000
  -D POWER_LOG_ADC_READS=1
  ; Heap and stack figures at each tailnet bring-up stage (TailscaleSocket.cpp).
  -D MESHTASTIC_TAILSCALE_DIAGNOSTICS=1
  -D USERPREFS_NETWORK_WIFI_ENABLED=true
  -D USERPREFS_NETWORK_WIFI_SSID='"Wokwi-GUEST"'
  -D USERPREFS_NETWORK_WIFI_PSK='""'
