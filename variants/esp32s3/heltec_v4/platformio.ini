[heltec_v4_base] 
extends = esp32s3_base
board = heltec_v4
board_check = true
board_build.partitions = default_16MB.csv
; Phase 2: overrides esp32_common's platformio/espressif32@6.13.0, which is
; Arduino core 2.0.17 on ESP-IDF 4.4.7. esp-idf-sys -- which the Rust side needs
; for xtensa-esp32s3-espidf -- treats 4.4 as legacy and is tested against
; 5.1-5.5, so the bump is a prerequisite for linking tailscale-rs at all, not a
; nice-to-have.
;
; pioarduino 55.03.312 = Arduino core 3.3.12 on ESP-IDF 5.5.5. The tree already
; carries ESP_ARDUINO_VERSION >= 3 gates (7 of them, 4 in WiFiAPClient.cpp), and
; variants/esp32c6/esp32c6.ini already overrides platform per-variant, so
; neither the Arduino 3 jump nor per-env platforms are new ground here.
;
; Scoped to this variant deliberately: changing esp32_common would drag every
; other ESP32 board along for the ride.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip

; libpax defines WIFI_CHANNEL_1..14 as macros (libpax_api.h:12). ESP-IDF 5.5
; introduced a `wifi_2g_channel_bit_t` enum using those same names, so libpax's
; macros rewrite IDF's enumerators into numeric literals and break IDF's own
; esp_wifi_types_generic.h. Not an Arduino 3 API problem -- a name collision.
;
; variants/esp32c6/esp32c6.ini already lib_ignores libpax for the same reason on
; the variant that was moved to pioarduino first, so this follows upstream's own
; workaround. The PAX counter is optional and unrelated to anything here.
lib_ignore =
  ${esp32_common.lib_ignore}
  libpax
; NimBLE-Arduino 2.x instead of esp32_common's 1.4.3, which targets IDF 4.4 and
; crashes on hardware inside IDF 5.5's esp_bt_controller_init (null call).
; m5stack-unitc6l runs 2.3.7 on Arduino 3.x the same way (NIMBLE_TWO below).
; PlatformIO cannot drop one entry from an inherited list, so esp32s3_base's is
; restated here with that one swap (libpax left out: ignored above).
lib_deps =
  ${arduino_base.lib_deps}
  ${networking_base.lib_deps}
  ${networking_extra.lib_deps}
  ${environmental_base.lib_deps}
  ${environmental_extra.lib_deps}
  ${radiolib_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-esp32_https_server packageName=https://github.com/meshtastic/esp32_https_server gitBranch=master
  https://github.com/meshtastic/esp32_https_server/archive/0c71f380390ad483ff134ad938e07f6cf1226c5b.zip
  # renovate: datasource=custom.pio depName=NimBLE-Arduino packageName=h2zero/library/NimBLE-Arduino
  h2zero/NimBLE-Arduino@2.3.7
  # renovate: datasource=custom.pio depName=XPowersLib packageName=lewisxhe/library/XPowersLib
  lewisxhe/XPowersLib@0.3.3
  # renovate: datasource=custom.pio depName=rweather/Crypto packageName=rweather/library/Crypto
  rweather/Crypto@0.4.0
  # renovate: datasource=git-refs depName=meshtastic-ESP32_Codec2 packageName=https://github.com/meshtastic/ESP32_Codec2 gitBranch=master
  https://github.com/meshtastic/ESP32_Codec2/archive/633326c78ac251c059ab3a8c430fcdf25b41672f.zip
build_flags = 
  ${esp32s3_base.build_flags}
  -D HELTEC_V4
  ; mbedTLS PSRAM-first (src/platform/esp32/MbedtlsPsram.cpp): keeps HTTPS/TLS out of scarce internal RAM.
  -D MESHTASTIC_MBEDTLS_PSRAM=1
  -Wl,--wrap=esp_mbedtls_mem_calloc
  -D NIMBLE_TWO
  ; NimbleBluetooth.cpp advertises through NimBLEExtAdvertising under NIMBLE_TWO.
  -D CONFIG_BT_NIMBLE_EXT_ADV=1
  -D CONFIG_BT_NIMBLE_MAX_EXT_ADV_INSTANCES=2
  -D HAS_LORA_FEM=1
  ; Paired with the libpax lib_ignore above: without this the Paxcounter module
  ; still compiles and reaches for headers that are no longer there.
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -I variants/esp32s3/heltec_v4


[env:heltec-v4]
custom_meshtastic_hw_model = 110
custom_meshtastic_hw_model_slug = HELTEC_V4
custom_meshtastic_architecture = esp32-s3
