[heltec_v4_base] 
extends = esp32s3_base
board = heltec_v4
board_check = true
board_build.partitions = default_16MB.csv
; Arduino 3.3.12 on ESP-IDF 5.5, which Rust's ESP-IDF std needs (esp32_common's IDF 4.4 is too old).
; Scoped to this variant, as esp32c6.ini does, so other ESP32 boards are unaffected.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip

; libpax's WIFI_CHANNEL_* macros collide with an ESP-IDF 5.5 enum; esp32c6.ini drops it the same way.
lib_ignore =
  ${esp32_common.lib_ignore}
  libpax
; esp32s3_base's list with NimBLE-Arduino 2.3.7 for 1.4.3, which crashes on IDF 5.5 (as m5stack-unitc6l does).
lib_deps =
  ${arduino_base.lib_deps}
  ${networking_base.lib_deps}
  ${networking_extra.lib_deps}
  ${environmental_base.lib_deps}
  ${environmental_extra.lib_deps}
  ${radiolib_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-esp32_https_server packageName=https://github.com/meshtastic/esp32_https_server gitBranch=master
  https://github.com/meshtastic/esp32_https_server/archive/0c71f380390ad483ff134ad938e07f6cf1226c5b.zip
  # renovate: datasource=custom.pio depName=NimBLE-Arduino packageName=h2zero/library/NimBLE-Arduino
  h2zero/NimBLE-Arduino@2.3.7
  # renovate: datasource=custom.pio depName=XPowersLib packageName=lewisxhe/library/XPowersLib
  lewisxhe/XPowersLib@0.3.3
  # renovate: datasource=custom.pio depName=rweather/Crypto packageName=rweather/library/Crypto
  rweather/Crypto@0.4.0
  # renovate: datasource=git-refs depName=meshtastic-ESP32_Codec2 packageName=https://github.com/meshtastic/ESP32_Codec2 gitBranch=master
  https://github.com/meshtastic/ESP32_Codec2/archive/633326c78ac251c059ab3a8c430fcdf25b41672f.zip
build_flags = 
  ${esp32s3_base.build_flags}
  -D HELTEC_V4
  ; mbedTLS PSRAM-first (src/platform/esp32/MbedtlsPsram.cpp): keeps HTTPS/TLS out of scarce internal RAM.
  -D MESHTASTIC_MBEDTLS_PSRAM=1
  -Wl,--wrap=esp_mbedtls_mem_calloc
  -D NIMBLE_TWO
  ; NimbleBluetooth.cpp advertises through NimBLEExtAdvertising under NIMBLE_TWO.
  -D CONFIG_BT_NIMBLE_EXT_ADV=1
  -D CONFIG_BT_NIMBLE_MAX_EXT_ADV_INSTANCES=2
  -D HAS_LORA_FEM=1
  ; Paired with the libpax lib_ignore above.
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -I variants/esp32s3/heltec_v4


[env:heltec-v4]
custom_meshtastic_hw_model = 110
custom_meshtastic_hw_model_slug = HELTEC_V4
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec V4
custom_meshtastic_images = heltec_v4.svg
custom_meshtastic_tags = Heltec
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB
custom_meshtastic_has_mui = true

extends = heltec_v4_base
build_flags = 
  ${heltec_v4_base.build_flags}
  -D HELTEC_V4_OLED
  -D USE_SSD1306 ; Heltec_v4 has an SSD1315 display (compatible with SSD1306 driver)
  -D LED_POWER=35
  -D RESET_OLED=21
  -D I2C_SDA=17
  -D I2C_SCL=18
  -D I2C_SDA1=4
  -D I2C_SCL1=3

[env:heltec-v4-tft]
