# REAL KEY. Run only after dry.yaml passes. Wokwi's gateway sees this traffic,
# so the key must be ephemeral and single-use, and deleted after the session.
name: Tailnet join, API reachable, battery cutoff
version: 1
author: Meshtastic + Tailscale bring-up
steps:
  - wait-serial: 'Battery ADC ready'
  - wait-serial: 'Power: battery hardware detected'
  - wait-serial: 'Obtained IP address'
  - wait-serial: 'Tailscale: joined tailnet as'
  - wait-serial: 'Tailscale: API server listening on'

  # Hold the node up so a client can connect over the tailnet
  # (meshtastic --host <tailnet ip> --info) before the battery test ends it.
  - delay: 60s

  # Position chosen for Wokwi's ADC, not real silicon. Measured: Wokwi maps the
  # pin voltage linearly onto 0..4095 regardless of attenuation (position
  # 0.2308 read raw=945, exactly 0.2308 * 4095), while the calibration curve
  # correctly assumes the 2.5 dB range of a real S3. So positions are derived
  # from measured raw->mV points, targeting 2850 mV: the centre of the
  # 2600..3100 mV window that arms the cutoff (margin +/- 0.034 in position).
  - set-control:
      part-id: batt
      control: position
      value: 0.3848
  - wait-serial: 'Low voltage counter: 1/10'
  - wait-serial: 'Low voltage detected, trigger deep sleep'
