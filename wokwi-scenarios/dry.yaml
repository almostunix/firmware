# DRY RUN with a dummy key: runtime start, key state, and a join the control plane rejects (expected),
# then the low-voltage cutoff. Spends no single-use key.
name: Dry run -- runtime, join attempt, battery cutoff
version: 1
author: almostunix
steps:
  # Battery sensing up at the pot's initial 3.90 V. Not 'usbPower=0', which prints only every 50 s;
  # the cutoff steps below prove it anyway.
  - wait-serial: 'Battery ADC ready'
  - wait-serial: 'Power: battery hardware detected'

  - wait-serial: 'Obtained IP address'

  # The runtime started and the key state was written.
  - wait-serial: 'Tailscale: joining tailnet as'

  # Drop the cell to ~2.85 V, inside the 2600-3100 mV window that arms the cutoff. Position for
  # Wokwi's linear ADC, not real silicon.
  - set-control:
      part-id: batt
      control: position
      value: 0.3848
  - wait-serial: 'Low voltage counter: 1/10'
  - wait-serial: 'Low voltage detected, trigger deep sleep'
